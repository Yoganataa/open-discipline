name: OpenCode latest compatibility smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - maturity-hardening

permissions:
  contents: read

concurrency:
  group: opencode-latest-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install plugin dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve latest stable OpenCode release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(curl --fail --silent --show-error             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/anomalyco/opencode/releases/latest)"
          version="$(printf '%s' "${release}" | jq -r '.tag_name | ltrimstr("v")')"
          asset="$(printf '%s' "${release}" | jq -r '.assets[] | select(.name == "opencode-linux-x64.tar.gz") | .browser_download_url')"
          digest="$(printf '%s' "${release}" | jq -r '.assets[] | select(.name == "opencode-linux-x64.tar.gz") | .digest')"

          test -n "${version}"
          test "${version}" != "null"
          test -n "${asset}"
          test "${asset}" != "null"
          test -n "${digest}"
          test "${digest}" != "null"
          test "${digest#sha256:}" != "${digest}"

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "asset=${asset}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest#sha256:}" >> "${GITHUB_OUTPUT}"
          echo "Testing latest stable OpenCode v${version}."

      - name: Download pinned latest OpenCode binary
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ASSET: ${{ steps.release.outputs.asset }}
          EXPECTED_SHA256: ${{ steps.release.outputs.digest }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error "${ASSET}" -o /tmp/opencode.tar.gz
          actual="$(sha256sum /tmp/opencode.tar.gz | awk '{print $1}')"
          test "${actual}" = "${EXPECTED_SHA256}"
          mkdir -p /tmp/opencode
          tar -xzf /tmp/opencode.tar.gz -C /tmp/opencode
          chmod +x /tmp/opencode/opencode
          echo "Downloaded OpenCode v${VERSION} with verified SHA256 ${actual}."

      - name: Verify binary version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          actual="$(/tmp/opencode/opencode --version)"
          test "${actual}" = "${VERSION}"

      - name: Verify plugin loads in real latest host
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          log="/tmp/opencode-${VERSION}.log"

          mkdir -p /tmp/opencode-project
          printf '{"plugin":["%s/.opencode/plugins/open-discipline.ts"]}\n' "$GITHUB_WORKSPACE" > /tmp/opencode-project/opencode.json

          OPENDISCIPLINE_SMOKE=1 /tmp/opencode/opencode --print-logs --log-level INFO serve --port 4096 >"${log}" 2>&1 &
          opencode_pid=$!
          trap 'kill "${opencode_pid}" 2>/dev/null || true; wait "${opencode_pid}" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 50); do
            if curl --fail --silent --show-error               -H "x-opencode-directory: /tmp/opencode-project"               "http://127.0.0.1:4096/config" >/tmp/opencode-config.json; then
              ready=1
              break
            fi
            if ! kill -0 "${opencode_pid}" 2>/dev/null; then
              echo "OpenCode exited before the instance became ready."
              cat "${log}"
              exit 1
            fi
            sleep 0.2
          done

          test "${ready}" = "1" || {
            echo "OpenCode did not become ready within 10 seconds."
            cat "${log}"
            exit 1
          }

          grep -F "[open-discipline] smoke: plugin loaded" "${log}" >/dev/null || {
            echo "OpenDiscipline plugin load evidence was not observed for OpenCode ${VERSION}."
            cat "${log}"
            exit 1
          }

          if grep -E "failed to load plugin|error.*open-discipline|OpenDiscipline.*Error" "${log}" >/dev/null; then
            echo "OpenDiscipline plugin reported a load error."
            cat "${log}"
            exit 1
          fi

          grep -E "server.*(started|listening|ready)|localhost|127\.0\.0\.1" "${log}" >/dev/null || {
            echo "OpenCode did not produce bounded server-start evidence."
            cat "${log}"
            exit 1
          }

          echo "OpenCode v${VERSION}: latest stable binary + OpenDiscipline plugin-load smoke passed."

      - name: Upload latest smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-latest-smoke-log
          path: /tmp/opencode-*.log
